<!doctype html>
<html lang="zh-Hans" data-dsh-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>邮箱</title>
<style>
  /*
   * 配色全部取自外壳下发的变量，页面自己不留一份色值 —— 用户在 App 里切日夜，这一页跟着变。
   * 兜底值写在第二个参数上，外壳没下发时也不至于一片白。
   */
  :root {
    --bg: var(--dsh-theme-background, #16171b);
    --surface: var(--dsh-theme-surface, #1d1e23);
    --border: var(--dsh-theme-border, rgba(255, 255, 255, 0.08));
    --text: var(--dsh-theme-text, #f9fafb);
    --text-2: var(--dsh-theme-text-secondary, #adb2b8);
    --muted: var(--dsh-theme-text-muted, #81858c);
    --primary: var(--dsh-theme-primary, #4176e6);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    /* 顶部安全区由外壳让过了（--dsh-safe-top 恒为 0），左右与底部仍按 env() 让。 */
    padding: var(--dsh-safe-top, 0px) var(--dsh-safe-left, 0px) var(--dsh-safe-bottom, 0px) var(--dsh-safe-right, 0px);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .placeholder {
    width: 100%;
    max-width: 420px;
    padding: 28px 24px;
    text-align: center;
  }

  .mark {
    width: 56px;
    height: 56px;
    margin: 0 auto 20px;
    border-radius: 16px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .mark svg { display: block; }

  h1 {
    margin: 0 0 10px;
    font-size: 19px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }

  p {
    margin: 0;
    font-size: 14px;
    line-height: 1.6;
    color: var(--text-2);
  }

  .hint {
    margin-top: 18px;
    font-size: 13px;
    color: var(--muted);
  }

  .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    margin-right: 6px;
    border-radius: 50%;
    background: var(--primary);
    vertical-align: 1px;
  }
</style>
</head>
<body>
  <div class="placeholder">
    <div class="mark">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true">
        <rect x="3.25" y="6.25" width="19.5" height="13.5" rx="2.75" stroke="currentColor" stroke-width="1.5" opacity="0.85"/>
        <path d="M4.5 8.5L13 14.25L21.5 8.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
      </svg>
    </div>
    <h1>邮箱</h1>
    <p>页面已经装进手机了，收发邮件那一半还没做。</p>
    <p class="hint"><span class="dot"></span>功能开发中</p>
  </div>
</body>
</html>
